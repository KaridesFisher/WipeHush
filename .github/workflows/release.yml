name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: bash scripts/test.sh
      - name: Build
        run: bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/WipeHush.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/WipeHush.zip dist/SHA256SUMS.txt \
              --verify-tag --title "WipeHush $GITHUB_REF_NAME" \
              --notes-file .github/RELEASE_NOTES.md
          fi
      - name: Retire the superseded prototype release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh api --silent --method PATCH "repos/$GITHUB_REPOSITORY/releases/427023573" \
              -F draft=true \
              -f name="WipeHush legacy prototype (superseded)" \
              -f body="This historical prototype is superseded by WipeHush v1.3.0. Use the current public release."
          fi
