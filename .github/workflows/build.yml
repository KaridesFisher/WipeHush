name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test session logic
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WipeHush-universal
          path: |
            dist/WipeHush.zip
            dist/SHA256SUMS.txt
